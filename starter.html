<!DOCTYPE html>
 <html>
    <head>
    <style>
        .title {
            color: rgb(62, 116, 58);
            font-family: Arial;
            text-align: center;
            border-bottom: solid 2px rgb(129, 163, 27);
            padding-bottom: 15px;

        }
       
        .search {
            color:rgb(16, 101, 25);
            border:1px solid rgb(65, 141, 67);
            border-radius: 9px;
            background-color:rgba(54, 148, 38, 0.371);
            width:180px;
            height:20px;
            margin-left: 20px;
            

            
        }
        
        
        .search:focus {
            background-color:rgba(78, 181, 71, 0.762);
            border:2px solid rgb(53, 117, 60);
            border:none;
            border-radius:20px;
        }
        .connexion-bt{
            background-color:rgba(78, 181, 71, 0.762);
            border : 1px solid rgb(60, 107, 60);
            border-radius :20px;
            width: 107px;
            height: 26px;
            cursor:pointer;
        }
        .connexion-bt:hover{
            box-shadow:2px 5px 5px rgba(21, 98, 16, 0.15);
            transition: box-shadow 0.2s;
        }
        .connexion-bt:active {
            opacity:0.7;
            transition:opacity 0.2s;
        }
        
        
        
    </style>


    </head>

    <body class="body">

        <div style="text-align: right;">

        </div>

   <p>Enter your password</p><input class="search" type="password">      <br>
         <br>
        
           <form >
             <select >

             </select>
           </form>

       <input type="month" placeholder="month"><br>

       <input type="datetime-local">
       

      
    
      </div>

 </html>
